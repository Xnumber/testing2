<main class="page-shell p-3">
	<section
		class="explorer"
		[class.explorer--collapsed]="sidebarCollapsed()"
		aria-label="產業主題探索區"
	>
		<app-term-board
			[terms]="topics()"
			[selectedTerm]="selectedTopic()"
			[collapsed]="sidebarCollapsed()"
			(termSelected)="selectTopic($event)"
			(sidebarToggled)="toggleSidebar()"
		/>
		<app-term-definition
			[selectedTerm]="selectedTopic()"
			[canGoPrevious]="canGoPrevious()"
			[canGoNext]="canGoNext()"
			(termMoved)="moveTopic($event)"
		/>
	</section>
</main>
