<main class="page-shell p-3">
	<section
		class="explorer"
		[class.explorer--collapsed]="sidebarCollapsed()"
		aria-label="產業探索區"
	>
		<app-term-board
			[terms]="industries"
			[selectedTerm]="selectedIndustry()"
			[collapsed]="sidebarCollapsed()"
			(termSelected)="selectIndustry($event)"
			(sidebarToggled)="toggleSidebar()"
		/>
		<div>
			<h2 class="subtitle">
				{{ selectedIndustry()?.title ?? "選擇一個項目" }}
			</h2>
			<app-term-definition-list
				[terms]="selectedSummary()"
				[canGoPrevious]="canGoPrevious()"
				[canGoNext]="canGoNext()"
				(termMoved)="moveIndustry($event)"
			/>
		</div>
	</section>
</main>
