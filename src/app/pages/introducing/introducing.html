	<main class="page-shell p-3">
		<section
		class="explorer"
		[class.explorer--collapsed]="sidebarCollapsed()"
		aria-label="財務名詞互動探索區"
	>
		<app-term-board
			[terms]="terms"
			[selectedTerm]="selectedTerm()"
			[collapsed]="sidebarCollapsed()"
			(termSelected)="selectTerm($event)"
			(sidebarToggled)="toggleSidebar()"
		/>
		<app-term-definition
			[selectedTerm]="selectedTerm()"
			[canGoPrevious]="canGoPrevious()"
			[canGoNext]="canGoNext()"
			(termMoved)="moveTerm($event)"
		/>
	</section>
