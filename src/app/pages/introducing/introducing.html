<main class="page-shell p-3">
	<section
		class="explorer"
		[class.explorer--collapsed]="sidebarCollapsed()"
		aria-label="財務名詞互動探索區"
	>
		<app-term-board
			[terms]="categories"
			[selectedTerm]="selectedCategory()"
			[collapsed]="sidebarCollapsed()"
			(termSelected)="selectCategory($event)"
			(sidebarToggled)="toggleSidebar()"
		/>
		<div>
			<h2 class="subtitle">
				{{ selectedCategory()?.title ?? "選擇一個項目" }}
			</h2>
			<app-term-definition-list
				[terms]="selectedTerms()"
				[canGoPrevious]="canGoPrevious()"
				[canGoNext]="canGoNext()"
				(termMoved)="moveCategory($event)"
			/>
		</div>
	</section>
</main>
